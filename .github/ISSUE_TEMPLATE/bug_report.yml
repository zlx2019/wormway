name: Bug report
description: Report something that does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        zora is pre-release. Please do not report security vulnerabilities here, see SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the configuration (with secrets removed) and a minimal reproduction if possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, kernel version, CPU architecture and container runtime.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output, with secrets removed.
      render: shell
