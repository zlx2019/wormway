# pre-commit hooks for zora.
#   Install (once):       pre-commit install
#   Run all fast checks:  pre-commit run --all-files
#   Run the slow checks:  pre-commit run --all-files --hook-stage pre-push
#   Bump hook versions:   pre-commit autoupdate --freeze
# Fast checks run on every commit. The slow ones (clippy, tests, docs, cargo-deny) run before
# a push. CI runs the same commands, so the hooks only give earlier feedback.
minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
# Hooks without an explicit stage only run on commit, so a push does not repeat them.
default_stages: [pre-commit]
fail_fast: false
# The changelog is generated by git-cliff, do not fight the generator.
exclude: ^CHANGELOG\.md$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      # Upstream also runs these three on push, restrict them to commits.
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      # Private keys must never be committed. Add an exclude here for test fixtures if needed.
      - id: detect-private-key
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      # Keep the two-space hard line breaks in Markdown.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]

  # Commit messages must follow Conventional Commits, see CONTRIBUTING.md and cliff.toml.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [build, chore, ci, docs, feat, fix, perf, refactor, revert, security, style, test]

  - repo: local
    hooks:
      # Fast checks, run on every commit.
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: typos
        name: typos
        entry: typos --force-exclude
        language: system
        types: [text]

      # Slow checks, run before a push. They use the same commands as the CI jobs.
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        language: system
        files: ^(.*\.rs|Cargo\.(toml|lock)|clippy\.toml)$
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-nextest
        name: cargo nextest
        entry: cargo nextest run --workspace --all-features --locked --no-tests pass
        language: system
        files: ^(.*\.rs|Cargo\.(toml|lock))$
        pass_filenames: false
        stages: [pre-push]
      # nextest does not run doctests, so run them separately.
      - id: cargo-doctest
        name: cargo doctest
        entry: cargo test --workspace --doc --all-features --locked
        language: system
        files: ^(.*\.rs|Cargo\.(toml|lock))$
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-doc
        name: cargo doc
        entry: bash -c 'RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features --locked'
        language: system
        files: ^(.*\.rs|Cargo\.(toml|lock))$
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-deny
        name: cargo deny
        entry: cargo deny check
        language: system
        files: ^(Cargo\.(toml|lock)|deny\.toml)$
        pass_filenames: false
        stages: [pre-push]
