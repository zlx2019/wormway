[workspace]
resolver = "3"
members = ["zora-core", "zora-runtime", "zora-control", "zora-gateway", "apps/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
authors = ["Zero <zero9501@outlook.com>"]
homepage = "https://github.com/zlx2019/zora"
repository = "https://github.com/zlx2019/zora"
license = "MIT"
readme = "README.md"
publish = false

[workspace.dependencies]
zora-control = { path = "zora-control" }
zora-core = { path = "zora-core" }
zora-gateway = { path = "zora-gateway" }
zora-runtime = { path = "zora-runtime" }

anyhow = "1.0.104"
arc-swap = "1.9.3"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4.3"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
# Pinned: every 0.x release breaks the API. Upgrades happen between milestones.
pingora = { version = "=0.9.0", default-features = false, features = ["lb", "proxy", "rustls"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rust-embed = "8.13.0"
# aws-lc-rs with post-quantum key exchange first; Pingora also compiles in ring.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "logging", "prefer-post-quantum", "std", "tls12"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
# Held at the 1.53 LTS line (supported until September 2027): Pingora 0.9.0 creates buffered
# streams with zero capacity, which panic since tokio 1.54. Lift once Pingora is fixed.
tokio = "~1.53"
tokio-util = "0.7.20"
toml = "1.1.8"
tower = "0.5.3"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = "0.3.23"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Release builds optimize across all crates as one unit: slower to build, faster to run.
[profile.release]
lto = "fat"
codegen-units = 1
