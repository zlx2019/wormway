[workspace]
resolver = "3"
members = ["zora-core", "zora-runtime", "zora-control", "apps/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
authors = ["Zero <zero9501@outlook.com>"]
homepage = "https://github.com/zlx2019/zora"
repository = "https://github.com/zlx2019/zora"
license = "MIT"
readme = "README.md"
publish = false

[workspace.dependencies]
zora-control = { path = "zora-control" }
zora-core = { path = "zora-core" }
zora-runtime = { path = "zora-runtime" }

anyhow = "1.0.104"
arc-swap = "1.9.3"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4.3"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-util = "0.7.20"
toml = "1.1.8"
tower = "0.5.3"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = "0.3.23"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
