[workspace]
resolver = "3"
members = ["wormway-core", "wormway-runtime", "wormway-control", "wormway-gateway", "wormway-tls", "wormway-acme", "apps/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
authors = ["Zero <zero9501@outlook.com>"]
homepage = "https://github.com/zlx2019/wormway"
repository = "https://github.com/zlx2019/wormway"
license = "MIT"
readme = "README.md"
publish = false

[workspace.dependencies]
wormway-acme = { path = "wormway-acme" }
wormway-control = { path = "wormway-control" }
wormway-core = { path = "wormway-core" }
wormway-gateway = { path = "wormway-gateway" }
wormway-runtime = { path = "wormway-runtime" }
wormway-tls = { path = "wormway-tls" }

anyhow = "1.0.104"
arc-swap = "1.9.3"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
bytes = "1.12.1"
# Times of the logs: strftime patterns and the local time zone. Pingora brings it in already.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
# Benchmarks only: without parallel analysis and plots, which Wormway does not use.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
getrandom = "0.4.3"
h2 = "0.4.20"
# The HTTP types of Pingora, for headers parsed once and reused by every request.
http = "1.5.0"
# The HTTP client of the DNS provider APIs, with bytes: instant-acme brings these in already.
http-body-util = "0.1.5"
hyper-rustls = { version = "0.27.7", default-features = false, features = ["aws-lc-rs", "http1", "rustls-platform-verifier", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
# ACME, with the key and CSR of each certificate (rcgen) and renewal information (time).
instant-acme = { version = "0.8.5", features = ["rcgen", "time"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
# Pinned: every 0.x release breaks the API. Upgrades happen between milestones.
pingora = { version = "=0.9.0", default-features = false, features = ["lb", "proxy", "rustls"] }
# The state of each key of the rate limits: bounded, and keys seen once are evicted first.
quick_cache = "0.7.0"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rust-embed = "8.13.0"
# aws-lc-rs with post-quantum key exchange first; Pingora also compiles in ring.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "logging", "prefer-post-quantum", "std", "tls12"] }
rustls-pki-types = "1.15.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
# Held at the 1.53 LTS line (supported until September 2027): Pingora 0.9.0 creates buffered
# streams with zero capacity, which panic since tokio 1.54. Lift once Pingora is fixed.
tokio = "~1.53"
tokio-rustls = { version = "0.26.6", default-features = false }
tokio-util = "0.7.20"
toml = "1.1.8"
tower = "0.5.3"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = "0.3.23"
tracing-log = "0.2.0"
# The version Pingora uses, so that one copy is built.
x509-parser = "0.16.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Release builds optimize across all crates as one unit: slower to build, faster to run.
[profile.release]
lto = "fat"
codegen-units = 1
