[workspace]
resolver = "3"
members = ["zora-core", "apps/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
authors = ["Zero <zero9501@outlook.com>"]
homepage = "https://github.com/zlx2019/zora"
repository = "https://github.com/zlx2019/zora"
license = "MIT"
readme = "README.md"
publish = false

[workspace.dependencies]
zora-core = { path = "zora-core" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
