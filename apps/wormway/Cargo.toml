[package]
name = "wormway"
description = "The Wormway program: gateway, proxy protocols, reverse tunnels and dashboard in one binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The allocator: jemalloc by default, which took about a fifth less CPU than the system's in
# benches/. Without default features the system's, or mimalloc with its feature; jemalloc is
# the one when both are on.
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
mimalloc = { workspace = true, optional = true }
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tikv-jemallocator = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing.workspace = true
tracing-log.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
wormway-acme.workspace = true
wormway-control = { workspace = true, features = ["ui"] }
wormway-core = { workspace = true, features = ["schema"] }
wormway-gateway.workspace = true
wormway-runtime.workspace = true
wormway-tls.workspace = true

[dev-dependencies]
rcgen.workspace = true

[lints]
workspace = true
