[package]
name = "zora"
description = "The zora program: gateway, proxy protocols, reverse tunnels and dashboard in one binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
zora-control = { workspace = true, features = ["ui"] }
zora-core = { workspace = true, features = ["schema"] }
zora-gateway.workspace = true
zora-runtime.workspace = true
zora-tls.workspace = true

[dev-dependencies]
rcgen.workspace = true

[lints]
workspace = true
