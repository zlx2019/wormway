# git-cliff configuration: generates CHANGELOG.md from Conventional Commits.
#   Preview unreleased changes: git cliff --unreleased
#   Write the changelog:        git cliff --output CHANGELOG.md
# Docs: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.
The changelog is generated by [git-cliff](https://git-cliff.org) from \
[Conventional Commits](https://www.conventionalcommits.org/), and the project adheres to \
[Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# Layout of a release: a title linking to the comparison, then one section per group.
# Entries with a scope come first, sorted by scope, followed by entries without one.
# The "security" scope is not repeated because its group already says it.
# The numeric HTML comment in a group name only fixes the group order, it is stripped here.
# Only the first line of a commit message is used.
body = """
---\n
{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}](%REPO%/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}](%REPO%/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    {% if previous.version %}\
        ## [Unreleased](%REPO%/compare/{{ previous.version }}..HEAD)
    {% else %}\
        ## Unreleased
    {% endif %}\
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        - {% if commit.scope != "security" %}**({{ commit.scope }})** {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | split(pat="\n") | first | trim | upper_first }} - \
            ([{{ commit.id | truncate(length=7, end="") }}](%REPO%/commit/{{ commit.id }})) - {{ commit.author.name }}
    {%- endfor -%}
    {% raw %}\n{% endraw %}\
    {%- for commit in commits %}
        {%- if commit.scope -%}
        {% else -%}
            - {% if commit.breaking %}[**breaking**] {% endif %}\
                {{ commit.message | split(pat="\n") | first | trim | upper_first }} - \
                ([{{ commit.id | truncate(length=7, end="") }}](%REPO%/commit/{{ commit.id }})) - {{ commit.author.name }}
        {% endif -%}
    {% endfor -%}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
# %REPO% is replaced with the repository URL, so the URL lives in one place.
postprocessors = [
    { pattern = '%REPO%', replace = "https://github.com/zlx2019/zora" },
]

[git]
conventional_commits = true
# Keep commits that do not follow Conventional Commits, they end up in "Other".
filter_unconventional = false
split_commits = false
# Breaking changes always show up, even if a skip rule below would match them.
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
commit_preprocessors = [
    # Turn "(#123)" into a link to the pull request.
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](%REPO%/pull/${1}))" },
]
# The first matching parser wins, so the order of the rules matters.
commit_parsers = [
    { message = "\\[skip", skip = true },
    # Commit messages are written in English, skip the ones that contain Chinese.
    { message = "\\p{Han}", skip = true },
    # Merge commits duplicate the commits of the pull request.
    { message = "^Merge (pull request|branch)", skip = true },
    # Types that do not belong in a user-facing changelog. Breaking commits ("type!:")
    # do not match this rule, so they are never skipped.
    { message = "^(docs|test|ci|build|style|chore)(\\([^)]*\\))?:", skip = true },
    { message = "^(fix\\(security\\)|security)", group = "<!-- 02 -->🛡️ Security" },
    { message = "^feat", group = "<!-- 00 -->🚀 Features" },
    { message = "^fix", group = "<!-- 01 -->🐛 Bug Fixes" },
    { message = "^perf", group = "<!-- 03 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 04 -->🚜 Refactoring" },
    { message = "^revert", group = "<!-- 05 -->◀️ Revert" },
    # Anything else that is still here (for example a breaking chore).
    { message = ".*", group = "<!-- 06 -->💼 Other" },
]

[bump]
# While the project is pre-1.0, a breaking change bumps the minor version instead of the major one.
breaking_always_bump_major = false
features_always_bump_minor = true
initial_tag = "v0.1.0"
