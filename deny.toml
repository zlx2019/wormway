# cargo-deny configuration: audits dependencies for security advisories, licenses,
# duplicate versions and sources.
# Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
# Reject yanked versions
yanked = "deny"
# Register advisories that are confirmed not to affect us here, with the reason
ignore = []

[licenses]
version = 2
# The project is MIT licensed, so dependency licenses must be compatible with it.
# GPL, AGPL and LGPL are not allowed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
