[package]
name = "wormway-control"
description = "Control plane of Wormway: SQLite storage, configuration versions and the Admin API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The dashboard, built from ui/ and embedded at compile time
ui = ["dep:rust-embed"]

[dependencies]
axum.workspace = true
getrandom.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
rust-embed = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "sync", "time"] }
tracing.workspace = true
wormway-core.workspace = true
wormway-runtime.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
