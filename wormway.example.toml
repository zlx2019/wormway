#:schema ./wormway.schema.json
# Example Wormway configuration. Only `version` is required. The values shown for [server], [log],
# [admin], [storage] and [acme] are the defaults.

version = 1

# ---- Static settings: a restart applies changes ----

[server]
threads = 0                 # data-plane worker threads, 0 = one per CPU core
shutdown_timeout = "30s"    # how long open connections may take to finish on shutdown

[log]
level = "info"              # tracing directives, such as "info,wormway_runtime=debug"
format = "text"             # text | json
time_zone = "utc"           # utc | local (the TZ variable, otherwise the system's time zone)
# time_format = "%Y-%m-%d %H:%M:%S%.3f"   # strftime; RFC 3339 if not set. The access log takes it
                                          # too, but its combined format keeps the layout of Nginx.

# The access log, off unless this table is set: one line per request.
[log.access]
format = "json"             # json | combined (the format of Nginx and Apache)
path = "logs/access.log"    # relative to this file; standard output if not set; SIGUSR1 reopens it

[admin]
listen = "127.0.0.1:9872"   # Admin API and dashboard
token_file = "admin.token"  # relative to storage.data_dir, created on first start if missing

[storage]
data_dir = "data"           # relative to the directory of this file

[config]
source = "file"             # db (default): dynamic settings live in the database
                            # file: dynamic settings are read from this file

# Certificates that set `acme` come from this certificate authority, and are renewed when a third
# of their lifetime is left. Using it agrees to the terms of service of the authority.
[acme]
directory = "letsencrypt"   # letsencrypt-staging, or the https:// URL of another ACME directory
# email = "ops@example.com"     # where the authority may write about the account
# ca = "certs/private-ca.pem"   # authorities of a private ACME directory, relative to this file

# ---- Dynamic settings: read from this file only when config.source = "file" ----

[listeners.web]
listen = ["0.0.0.0:8080"]
protocol = "http"
http = { keepalive_timeout = "75s", h2c = false }   # defaults; "0s" turns keep-alive off,
                                                    # h2c accepts HTTP/2 without TLS

[listeners.websecure]
listen = ["0.0.0.0:8443"]
protocol = "http"
# The host name the client sends picks the certificate; unknown_sni: "default" presents the
# first certificate to other names, "reject" fails their handshake. HTTP/2 is agreed on during
# the handshake.
tls = { certificates = ["example"], unknown_sni = "default" }

# Requests go to the matching route with the highest priority; among equal ones, the most
# specific: exact host, then wildcard host, then any host; then exact path, then regex, then the
# longest prefix; then a route with methods; then the one with more header conditions. Paths
# are compared after decoding %XX, resolving "." and ".." and merging slashes.
[routes.app]
listeners = ["web"]                      # default: every HTTP listener
match = { hosts = ["app.example.com", "*.app.example.com"], paths = ["/"] }
upstream = "app"

# Requests sent upstream carry X-Forwarded-For, X-Forwarded-Proto, X-Forwarded-Host, X-Real-IP
# and X-Request-Id, replacing what the client sent; request_headers run after them.
[routes.app-api]
priority = 0                             # default; higher wins over every other rule
match = { hosts = ["app.example.com"], paths = ["/api/", { exact = "/health" }, { regex = "^/v[0-9]+/" }], methods = ["GET", "POST"], headers = { "X-Canary" = "1", "Authorization" = true } }
upstream = "app"
rewrite = { strip_prefix = "/api", add_prefix = "/v2" }      # /api/users goes upstream as /v2/users
request_headers = { remove = ["X-Debug"], set = { "X-Env" = "prod" }, add = { "X-Via" = "wormway" } }
response_headers = { set = { "Strict-Transport-Security" = "max-age=63072000" } }
compress = true                          # gzip, br or zstd, the first the client accepts
timeouts = { read = "5m" }               # read and write, in place of those of the upstream

# Instead of an upstream, a route can answer with a redirect, where {host} and {uri} come from
# the request (status 301, 302, 303, 307 or 308, default 302), or with a fixed response.
[routes.to-https]
listeners = ["web"]
redirect = { to = "https://{host}:8443{uri}", status = 301 }

[routes.maintenance]
match = { paths = ["/maintenance"] }
respond = { status = 503, body = "down for maintenance" }
access_log = false                       # default true; leaves the route out of the access log

# Targets are IP addresses or host names, with a port. Host names are resolved on every change
# and every 30 seconds after; each of their addresses becomes a target with the weight of the
# name. A change with a name that does not resolve is rejected.
[upstreams.app]
targets = ["127.0.0.1:3000", { address = "localhost:3001", weight = 2 }]
balance = "round_robin"                  # default; or random, least_conn, consistent_hash
# hash_key = { cookie = "session" }      # consistent_hash only: "client_ip" (default), "uri",
                                         # { header = "X-User" } or { cookie = "..." }; requests
                                         # without the key use the client IP address
timeouts = { connect = "10s", read = "60s", write = "60s", idle = "60s" }   # the defaults; 504 when out of time
retries = 1                              # default; other targets tried when connecting fails,
                                         # never after the request reached a target
# Probe every target, and new ones before they get requests; kind "tcp" only connects.
health_check = { kind = "http", path = "/healthz", interval = "5s", timeout = "2s", healthy = 2, unhealthy = 3 }
# Off unless set: a target whose requests fail max_fails times within fail_timeout gets none for
# fail_timeout. passive = {} takes these defaults.
passive = { max_fails = 1, fail_timeout = "10s" }

# HTTPS to the targets, here over HTTP/2 (protocol "h1" is the default; "h2c" is HTTP/2 without
# TLS). Certificates are checked against the system's authorities unless ca is set, for the host
# name of each target, or its IP address. Relative paths are relative to this file.
[upstreams.payments]
targets = ["payments.internal:443"]
protocol = "h2"
tls = { ca = "certs/internal-ca.crt", cert = "certs/wormway-client.crt", key = "certs/wormway-client.key" }

# Relative paths are relative to this file. The files are read again on every change and on
# SIGHUP, so renewed certificates take effect without a restart.
[certificates.example]
cert = "certs/example.crt"
key = "certs/example.key"

# Or from the certificate authority of [acme]. HTTP-01, the default challenge, needs an HTTP
# listener on port 80 for the names. Issued certificates are kept in the database.
[certificates.site]
acme = { domains = ["example.com", "www.example.com"] }

# Wildcard names need DNS-01, which publishes TXT records through the API of the DNS provider.
# The configuration refers to the token, { env = "NAME" } or { file = "path" }, never holds it.
[certificates.wildcard]
acme = { domains = ["*.example.com"], challenge = "dns-01", dns = { provider = "cloudflare", api_token = { env = "CLOUDFLARE_API_TOKEN" } } }
