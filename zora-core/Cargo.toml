[package]
name = "zora-core"
description = "Core types for zora: configuration model, route and rule matching, and error types, with no networking framework dependencies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# JSON Schema of the configuration file, for editors and `zora schema`
schema = ["dep:schemars"]

[dependencies]
schemars = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
